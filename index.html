<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة القصص | Bubbles بالعربي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip@1.0.0/css/dflip.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip@1.0.0/css/themify-icons.min.css">
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #106B6B; overflow: hidden; 
            font-family: 'Almarai', sans-serif; 
        }
        
/* Moves the book area to the right */
        #flipbookContainer { 
            position: absolute;
            top: 0;
            right: 0; /* Changed from left to right */
            width: calc(100% - 240px); 
            height: 100vh; 
        }

        /* Moves the library menu to the left */
        .library-menu {
            position: fixed; 
            top: 0;
            left: 0; /* Changed from right to left */
            width: 240px;
            height: 100vh;
            z-index: 999999 !important; 
            background: rgba(237, 246, 247, 0.98); 
            padding: 20px 10px;
            border-right: 3px solid #106B6B; /* Moved the border to the right side */
            box-shadow: 4px 0 15px rgba(0,0,0,0.3); /* Flipped the shadow direction */
            display: flex;
            flex-direction: column; 
            gap: 20px;
            align-items: center;
            overflow-y: auto; 
            overflow-x: hidden;
            box-sizing: border-box;
        }
        /* Custom Scrollbar for the Sidebar */
        .library-menu::-webkit-scrollbar { width: 8px; }
        .library-menu::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .library-menu::-webkit-scrollbar-thumb { background: #106B6B; border-radius: 10px; }

        .library-menu h3 {
            margin: 0 0 10px 0;
            color: #106B6B;
            font-size: 24px;
            padding-bottom: 15px;
            border-bottom: 3px solid #106B6B; /* Line under the title */
            border-left: none; /* Removed the old side line */
            font-weight: 700;
            text-align: center;
            width: 80%;
            flex-shrink: 0;
        }

        .thumb-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #106B6B;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            flex-shrink: 0; 
            width: 100%;
        }

        .thumb-btn:hover { transform: translateY(-3px) scale(1.05); color: #0d5252; }

        .thumb-btn img {
            width: 85px; 
            height: 115px;
            object-fit: cover;
            border: 2px solid #106B6B;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 8px;
            background-color: #fff;
        }

        /* MOBILE SNAP-TO-BOTTOM */
        /* If the screen is small (iPads/Phones), move the sidebar to the bottom so the book fits */
        @media (max-width: 800px) {
            .library-menu {
                top: auto;
                bottom: 0;
                width: 100%;
                height: 130px;
                flex-direction: row; /* Horizontal again */
                overflow-x: auto;
                overflow-y: hidden;
                border-left: none;
                border-top: 3px solid #106B6B;
                padding: 10px 15px;
            }
            .library-menu h3 { display: none; } /* Hide title to save space on mobile */
            #flipbookContainer { width: 100%; height: calc(100vh - 130px); }
            .thumb-btn { width: auto; }
            .thumb-btn img { width: 60px; height: 80px; }
            .thumb-btn span { font-size: 12px; }
        }
    
        #bookList { display:flex; flex-direction:column; gap:18px; width:100%; }
        .thumb-btn[aria-current="page"] { background:#d5f5ef; border-radius:12px; padding:8px 0; }
        .cover-fallback { display:grid; place-items:center; width:85px; height:115px; padding:8px; margin-bottom:8px; border:2px solid #106B6B; border-radius:8px; background:linear-gradient(135deg,#e9fbf8,#fff0e2); font-size:15px; }
        .reader-main { position:absolute; inset:0 0 0 240px; background:#EDF6F7; }
        .reader-header { min-height:76px; padding:10px 18px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; box-sizing:border-box; }
        .reader-header h1 { font-size:21px; margin:0; color:#106B6B; }
        .reader-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .reader-actions a { display:inline-flex; align-items:center; min-height:44px; padding:0 12px; border-radius:16px; background:#fff; color:#106B6B; font-weight:700; text-decoration:none; }
        a:focus-visible { outline:3px solid #FFB74D; outline-offset:3px; }
        #flipbookContainer { top:76px; right:0; width:100%; height:calc(100% - 76px); }
        #readerStatus { position:absolute; top:78px; right:16px; z-index:2; margin:0; padding:8px 12px; border-radius:12px; background:#fff; color:#106B6B; }
        #readerStatus[hidden] { display:none; }
        .embed-mode .library-menu { display:none; }
        .embed-mode .reader-main { inset:0; }
        @media(max-width:800px) {
          .reader-main { inset:0 0 130px; }
          #bookList { flex-direction:row; width:auto; gap:14px; }
          .library-menu { border-right:0; }
          .cover-fallback { width:60px; height:80px; font-size:12px; padding:4px; box-sizing:border-box; }
          .reader-header { min-height:112px; padding:8px 12px; }
          .reader-header h1 { width:100%; font-size:18px; }
          #flipbookContainer { top:112px; height:calc(100% - 112px); }
          #readerStatus { top:114px; }
        }
        @media(prefers-reduced-motion:reduce) { .thumb-btn { transition:none; } }
    </style>
</head>
<body>

    <aside class="library-menu" aria-label="اختيار قصة">
      <h3>📚 قصص Bubbles</h3><nav id="bookList" aria-label="الكتب المتاحة"></nav>
    </aside>
    <main class="reader-main">

    </main>

];
      const params = new URLSearchParams(location.search);
      const requested = params.get("book") || "The-Room";
      const book = BOOKS.find(item => item.id === requested && item.available)
        || BOOKS.find(item => item.id === "The-Room");
      document.body.classList.toggle("embed-mode", params.get("embed") === "1");
      document.title = book.title + " | Bubbles بالعربي";
      document.getElementById("bookTitle").textContent = book.title;
      const pdfUrl = new URL(book.pdf, location.href).href;
      document.getElementById("pdfLink").href = pdfUrl;
      const fullUrl = new URL(location.href);
      fullUrl.searchParams.set("book", book.id);
      fullUrl.searchParams.delete("embed");
      document.getElementById("fullReaderLink").href = fullUrl.href;
      const list = document.getElementById("bookList");
      BOOKS.filter(item => item.available).forEach(item => {
        const link = document.createElement("a");
        link.className = "thumb-btn";
        const url = new URL(location.href);
        url.searchParams.set("book", item.id);
        link.href = url.href;
        if (item.id === book.id) link.setAttribute("aria-current", "page");
        const fallback = () => {
          const cover = document.createElement("span");
          cover.className = "cover-fallback";
          cover.textContent = item.title;
          cover.setAttribute("aria-hidden", "true");
          return cover;
        };
        if (item.cover) {
          const img = document.createElement("img");
          img.src = item.cover; img.alt = ""; img.loading = "lazy";
          img.addEventListener("error", () => img.replaceWith(fallback()), {once:true});
          link.append(img);
        } else link.append(fallback());
        const label = document.createElement("span");
        label.textContent = item.title; link.append(label); list.append(link);
      });
      const status = document.getElementById("readerStatus");
      if (requested !== book.id) status.textContent = "هذه القصة غير متاحة حاليًا. اخترنا لك قصة الغرفة.";
      const loadingTimeout = setTimeout(() => {
        status.hidden = false;
        status.textContent = "إذا لم تظهر القصة، استخدم زر فتح PDF.";
      }, 20000);
      function readerReady() { clearTimeout(loadingTimeout); status.hidden = true; }
      function readerFailed() {
        clearTimeout(loadingTimeout); status.hidden = false;
        status.textContent = "تعذّر تحميل القارئ. يمكنك فتح القصة باستخدام زر فتح PDF.";
      }
      try {
        if (!window.jQuery || !jQuery.fn.flipBook) throw new Error("Reader unavailable");
        jQuery("#flipbookContainer").flipBook(pdfUrl, {
          direction: 2, height: "100%",
          duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 700,
          backgroundColor: "#EDF6F7",

          singlePageMode: 2, onReady: readerReady,
